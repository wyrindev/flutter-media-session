name: Release Notes Generator

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Generate Release Notes
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '');
            const isPreRelease = tag.includes("-pre");
            if (isPreRelease) return;

            const version = tag.startsWith("v") ? tag.slice(1) : tag;

            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const previousTag = releases.length > 0 ? releases[0].tag_name : null;

            const compare = await github.rest.repos.compareCommits({
              owner: context.repo.owner,
              repo: context.repo.repo,
              base: previousTag || "main",
              head: tag,
            });

            const prNumbers = new Set();
            for (const commit of compare.data.commits) {
              const match = commit.commit.message.match(/#(\d+)/);
              if (match) prNumbers.add(match[1]);
            }

            const entries = [];

            for (const prNumber of prNumbers) {
              try {
                const { data: pr } = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                });

                let fixesSuffix = "";
                try {
                  const query = `
                    query($owner: String!, $repo: String!, $number: Int!) {
                      repository(owner: $owner, name: $repo) {
                        pullRequest(number: $number) {
                          closingIssuesReferences(first: 10) {
                            nodes {
                              number
                              author {
                                login
                              }
                            }
                          }
                        }
                      }
                    }
                  `;
                  const result = await github.graphql(query, {
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    number: pr.number,
                  });

                  const linkedIssues = result?.repository?.pullRequest?.closingIssuesReferences?.nodes || [];
                  if (linkedIssues.length > 0) {
                    const authorMap = new Map();
                    for (const issue of linkedIssues) {
                      const author = issue.author?.login || null;
                      if (!authorMap.has(author)) {
                        authorMap.set(author, []);
                      }
                      authorMap.get(author).push(`#${issue.number}`);
                    }

                    const authorParts = [];
                    for (const [author, issueNumbers] of authorMap.entries()) {
                      const issuesStr = issueNumbers.join(" ");
                      authorParts.push(author ? `${issuesStr} @${author}` : issuesStr);
                    }

                    let fixesPart = "";
                    if (authorParts.length === 1) {
                      fixesPart = authorParts[0];
                    } else if (authorParts.length === 2) {
                      fixesPart = `${authorParts[0]} and ${authorParts[1]}`;
                    } else {
                      fixesPart = `${authorParts.slice(0, -1).join(", ")}, and ${authorParts[authorParts.length - 1]}`;
                    }

                    fixesSuffix = `, fixes ${fixesPart}`;
                  }
                } catch (gqlErr) {
                  console.log(`Error querying linked issues for PR #${prNumber}: ${gqlErr.message}`);
                }

                entries.push(`* ${pr.title} (#${pr.number} @${pr.user.login}${fixesSuffix})`);
              } catch (e) {
                console.log(`Error fetching PR #${prNumber}: ${e.message}`);
              }
            }

            const changesSection = entries.length > 0 ? entries.join('\n') : '* No pull requests recorded.';
            const body = [
              '### 📦 Changes',
              changesSection,
              '',
              '### 🔗 Full Changelog',
              `https://github.com/${context.repo.owner}/${context.repo.repo}/compare/${previousTag || "v0.0.0"}...${tag}`
            ].join('\n');

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `flutter_media_session v${version}`,
              body: body,
              draft: false,
              prerelease: false
            });