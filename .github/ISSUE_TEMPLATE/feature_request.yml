name: Feature Request
description: Suggest a feature or enhancement
title: "feat: "
labels: ["enhancement"]
body:
  - type: dropdown
    id: platforms
    attributes:
      label: Target platform(s)
      multiple: true
      options:
        - Android
        - iOS
        - macOS
        - Windows
        - Web
        - All
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      placeholder: What limitation or gap does this address?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      placeholder: |
        Describe the behavior you want, including a draft Dart API if you have one:

        ```dart
        await session.someNewMethod(...);
        ```
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Screenshots, native API references (Apple MediaPlayer, Android Media3, etc.), or related issues.
    validations:
      required: false
