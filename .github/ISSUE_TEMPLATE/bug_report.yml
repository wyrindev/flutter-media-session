name: Bug Report
description: File a bug report
title: "bug: "
labels: ["bug"]
body:
  - type: dropdown
    id: platforms
    attributes:
      label: Platform(s)
      multiple: true
      options:
        - Android
        - iOS
        - macOS
        - Windows
        - Web
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "e.g. 3.1.0 or git sha"
    validations:
      required: true
  - type: input
    id: os-version
    attributes:
      label: OS / device
      placeholder: "e.g. Android 14 (Pixel 7), iOS 17.4, Windows 11 23H2"
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: Describe the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: flutter-doctor
    attributes:
      label: flutter doctor -v
      render: shell
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Logs / stacktrace
      render: shell
    validations:
      required: false
